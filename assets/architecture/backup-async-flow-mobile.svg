</g></symbol><symbol id="icon-workflow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect xmlns="http://www.w3.org/2000/svg" width="8" height="8" x="3" y="3" rx="2" />
  <path xmlns="http://www.w3.org/2000/svg" d="M7 11v4a2 2 0 0 0 2 2h4" />
  <rect xmlns="http://www.w3.org/2000/svg" width="8" height="8" x="13" y="13" rx="2" />
</g></symbol></defs>
<rect width="640" height="1370" fill="#fff"/>
<g font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="32" y="50" text-anchor="start" font-size="33" font-weight="700" fill="#2855bf">문제 · 장시간 스레드 점유</text><rect x="32" y="90" width="576" height="165" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-database" x="60" y="136" width="70" height="70" color="#2855bf"/><text x="166" y="138" text-anchor="start" font-size="31" font-weight="700" fill="#20252c">DB 크기 증가</text><text x="166" y="186" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">백업 대상 데이터 증가</text><path d="M 320 261 L 320 284" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="290" width="576" height="165" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-terminal" x="60" y="336" width="70" height="70" color="#2855bf"/><text x="166" y="338" text-anchor="start" font-size="31" font-weight="700" fill="#20252c">백업 시간 증가</text><text x="166" y="386" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">백업 · 전송 작업 장기화</text><path d="M 320 461 L 320 484" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="490" width="576" height="165" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-user-round" x="60" y="536" width="70" height="70" color="#2855bf"/><text x="166" y="538" text-anchor="start" font-size="31" font-weight="700" fill="#20252c">스레드 점유</text><text x="166" y="586" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">요청 스레드 장시간 점유</text><text x="32" y="725" text-anchor="start" font-size="33" font-weight="700" fill="#2855bf">조치 · 실행 분리와 결과 확인</text><rect x="32" y="765" width="576" height="165" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-workflow" x="60" y="811" width="70" height="70" color="#2855bf"/><text x="166" y="813" text-anchor="start" font-size="31" font-weight="700" fill="#20252c">실행 분리</text><text x="166" y="861" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">요청 처리와 백업 작업 분리</text><text x="166" y="896" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">백업 작업 비동기 실행</text><path d="M 320 936 L 320 959" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="965" width="576" height="165" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-shield-check" x="60" y="1011" width="70" height="70" color="#2855bf"/><text x="166" y="1013" text-anchor="start" font-size="31" font-weight="700" fill="#20252c">완료 결과 검증</text><text x="166" y="1061" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">백업 완료 후 결과 판독</text><text x="166" y="1096" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">백업 결과 검증</text><path d="M 320 1136 L 320 1159" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="1165" width="576" height="165" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-database" x="60" y="1211" width="70" height="70" color="#2855bf"/><text x="166" y="1213" text-anchor="start" font-size="31" font-weight="700" fill="#20252c">진행 결과 확인</text><text x="166" y="1261" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">실행 이력 기록</text><text x="166" y="1296" text-anchor="start" font-size="25" font-weight="400" fill="#2855bf">백업 진행 결과 확인</text></g></svg>