<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1370" viewBox="0 0 640 1370" role="img" aria-labelledby="title desc">
<title id="title">DB 크기 증가에 따른 스레드 점유와 백업 결과 확인</title><desc id="desc">DB 크기가 커질수록 백업·전송 시간이 증가해 동기 백업 흐름의 요청 스레드를 장시간 점유. 백업 작업을 비동기로 분리하고 완료 후 결과 판독·검증·이력 기록을 통해 백업 진행 결과를 확인.</desc>
