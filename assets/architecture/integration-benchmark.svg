<title id="title">동일 호스트 사양의 운영체제별 평균 응답시간</title><desc id="desc">동일 호스트 사양, JVM 24GB, Postman 조건별 1분 시험. 30000건과 200000건, 가상 사용자 1·5·10명 조건의 Ubuntu 22.04.5와 RHEL 9.4 응답시간 비교. 패널별 눈금 범위가 다름.</desc>
