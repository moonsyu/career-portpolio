<title id="title">복호화된 요청의 XSS 필터 적용과 결과 전달</title><desc id="desc">복호화 후 JSON 객체·배열의 문자열을 순회하고 AntiSamy 정제 결과를 요청 본문에 반영. 정책 파일을 한 번 로드해 재사용. 보안 명세서 테스트 로그에서 script 태그가 정제된 문자열로 전달됨을 확인.</desc>
