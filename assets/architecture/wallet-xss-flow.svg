="#icon-book-open" x="69" y="438" width="46" height="46" color="#2855bf"/><text x="145" y="453" text-anchor="start" font-size="28" font-weight="700" fill="#2855bf">정책 파일 1회 로드 · 재사용</text><text x="145" y="491" text-anchor="start" font-size="22" font-weight="400" fill="#20252c">요청마다 정책 파일을 다시 읽는 처리 방지</text><text x="45" y="565" text-anchor="start" font-size="27" font-weight="700" fill="#2855bf">테스트에서 확인한 입력 → 전달 결과</text><rect x="40" y="596" width="545" height="128" rx="22" fill="#fff" stroke="#c9d6e8" stroke-width="1.6"/><text x="312" y="646" text-anchor="middle" font-size="27" font-weight="700" fill="#20252c">script 태그가 포함된 입력</text><text x="312" y="689" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">요청 파라미터에 공격 구문 입력</text><rect x="735" y="596" width="545" height="128" rx="22" fill="#fff" stroke="#c9d6e8" stroke-width="1.6"/><text x="1007" y="646" text-anchor="middle" font-size="27" font-weight="700" fill="#20252c">script 태그가 제거된 값</text><text x="1007" y="689" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">업무 처리 로그의 정제 문자열 확인</text><path d="M 595 660 L 725 660" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>