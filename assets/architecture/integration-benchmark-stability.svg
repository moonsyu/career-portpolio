<title id="title">20만 건 조회의 응답 지연과 오류율 비교</title><desc id="desc">동일 호스트 사양, JVM 24GB, 조건별 1분. VU 5와 10 조건의 평균·P95·오류율을 함께 비교. VU 10에서 Ubuntu와 RHEL 모두 오류가 발생해 고부하 안정성 한계를 확인.</desc>
