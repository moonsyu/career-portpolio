<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
<title id="title">AI를 활용한 기술 검증과 개발 오류 해결</title><desc id="desc">AI로 SSH 라이브러리 후보를 탐색한 뒤 취약점·버전 이력·업데이트 지속 여부를 직접 검증해 선택. AI 제안 코드의 오류는 로그·공식 문서로 메서드 변경을 확인하고 최신 문서를 Gemini에 전달해 수정 방향을 검토한 후 직접 반영.</desc>
