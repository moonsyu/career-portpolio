  <path xmlns="http://www.w3.org/2000/svg" d="m9 12 2 2 4-4" />
</g></symbol><symbol id="icon-terminal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path xmlns="http://www.w3.org/2000/svg" d="M12 19h8" />
