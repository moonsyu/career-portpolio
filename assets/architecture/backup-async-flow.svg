  <rect xmlns="http://www.w3.org/2000/svg" width="8" height="8" x="13" y="13" rx="2" />
</g></symbol></defs>
<rect width="1320" height="860" fill="#fff"/>
<g font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="40" y="60" text-anchor="start" font-size="30" font-weight="700" fill="#2855bf">문제 · DB 크기 증가에 따른 스레드 점유</text><rect x="40" y="92" width="360" height="315" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-database" x="182" y="130" width="76" height="76" color="#2855bf"/><text x="220" y="258" text-anchor="middle" font-size="29" font-weight="700" fill="#20252c">DB 크기 증가</text><text x="220" y="314" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">백업 대상 데이터 증가</text><path d="M 408 245 L 472 245" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="480" y="92" width="360" height="315" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-terminal" x="622" y="130" width="76" height="76" color="#2855bf"/><text x="660" y="258" text-anchor="middle" font-size="29" font-weight="700" fill="#20252c">백업 시간 증가</text><text x="660" y="314" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">백업 · 전송 작업 장기화</text><path d="M 848 245 L 912 245" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="920" y="92" width="360" height="315" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-user-round" x="1062" y="130" width="76" height="76" color="#2855bf"/><text x="1100" y="258" text-anchor="middle" font-size="29" font-weight="700" fill="#20252c">스레드 점유</text><text x="1100" y="314" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">요청 스레드 장시간 점유</text><text x="40" y="467" text-anchor="start" font-size="30" font-weight="700" fill="#2855bf">조치 · 비동기 실행과 완료 결과 확인</text><rect x="40" y="499" width="360" height="315" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-workflow" x="182" y="537" width="76" height="76" color="#2855bf"/><text x="220" y="665" text-anchor="middle" font-size="29" font-weight="700" fill="#20252c">실행 분리</text><text x="220" y="721" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">요청 처리와 백업 작업 분리</text><text x="220" y="761" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">백업 작업 비동기 실행</text><path d="M 408 652 L 472 652" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="480" y="499" width="360" height="315" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-shield-check" x="622" y="537" width="76" height="76" color="#2855bf"/><text x="660" y="665" text-anchor="middle" font-size="29" font-weight="700" fill="#20252c">완료 결과 검증</text><text x="660" y="721" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">백업 완료 후 결과 판독</text><text x="660" y="761" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">백업 결과 검증</text><path d="M 848 652 L 912 652" fill="none" stroke="#20252c" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="920" y="499" width="360" height="315" rx="22" fill="#f7f9fc" stroke="#c9d6e8" stroke-width="1.6"/><use href="#icon-database" x="1062" y="537" width="76" height="76" color="#2855bf"/><text x="1100" y="665" text-anchor="middle" font-size="29" font-weight="700" fill="#20252c">진행 결과 확인</text><text x="1100" y="721" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">실행 이력 기록</text><text x="1100" y="761" text-anchor="middle" font-size="23" font-weight="400" fill="#2855bf">백업 진행 결과 확인</text></g></svg>